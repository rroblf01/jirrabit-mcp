name: Publish Docker image

# Releases only, deliberately. A tag can be pushed by anyone with write access
# and a mistake is then permanent and public; a published release is a decision
# somebody made on purpose. The `ci.yml` workflow runs on every push, so the
# commit behind a release has already been through the test suite by the time
# this runs.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Two releases in a row must not race on the same tags.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Dockerfile does not build Go itself for the target platform: it
      # compiles with TARGETOS/TARGETARCH under QEMU. That is slow and it needs
      # binfmt registered, which is what this step does.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # jirrabit is commonly self-hosted on a small ARM VPS, and a
          # linux/amd64-only image would make the server unusable there.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The server reports this over MCP in its initialize response, which
          # is how somebody tells which build they are talking to. Without it
          # every published image would answer "dev".
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
